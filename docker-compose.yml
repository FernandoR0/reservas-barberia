services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: barberia
      MYSQL_USER: barberia
      MYSQL_PASSWORD: barberia_local_only
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_only"]
      interval: 5s
      retries: 20

volumes:
  mysql_data:
